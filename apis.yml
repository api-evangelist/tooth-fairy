name: Tooth Fairy
description: Toothfairy is a UK dental telehealth platform billing itself as the world's
  first dentist on-demand, pairing registered dentists with a consumer mobile app to
  deliver teeth straightening with clear aligners, prescription teeth whitening, and
  same-day emergency video dental consultations 24/7, plus employer dental plans for
  businesses. The company is health-regulated in the UK, backed by Seedcamp, and ships
  its product as iOS and Android apps with no public developer API surface.
